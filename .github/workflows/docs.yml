name: Documentation for @leanprover/infoview

on:
  pull_request:
  push:
    branches: [master]
    # No `tags` because `on-push.yml` invokes this workflow on tag pushes (via the `package` job).
  # Other workflows can run the `deploy` job below by setting this to `true`.
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false
  # The `deploy` job can also be run manually.
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to GitHub Pages'
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build docs
        run: |
          npm ci
          npm run build --workspace=lean4-infoview-api
          npm run docs --workspace=lean4-infoview

      - name: Read @leanprover/infoview version
        id: version
        run: echo "version=$(node -p "require('./lean4-infoview/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: infoview-docs
          path: lean4-infoview/docs
          include-hidden-files: true

  # Build and push docs for the current version of @leanprover/infoview
  # to `infoview/<version>/` on the `gh-pages` branch.
  deploy:
    needs: build
    if: inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Download docs
        uses: actions/download-artifact@v4
        with:
          name: infoview-docs
          path: docs

      - name: Push to gh-pages
        working-directory: site
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -e "infoview/$VERSION" ]; then
            echo "Docs for @leanprover/infoview $VERSION have already been pushed to gh-pages."
            exit 0
          fi

          mkdir -p "infoview/$VERSION"
          cp -r ../docs/. "infoview/$VERSION"/
          touch .nojekyll

          # Redirect the `infoview/` URL to the latest version.
          latest="$(cd infoview && printf '%s\n' */ | tr -d / | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          cat > infoview/index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./$latest/">
          <link rel="canonical" href="./$latest/">
          <a href="./$latest/">@leanprover/infoview $latest</a>
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add docs for @leanprover/infoview $VERSION"
          git push origin gh-pages
