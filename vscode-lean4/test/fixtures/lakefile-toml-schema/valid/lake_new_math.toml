# The `lakefile.toml` of the `math` template of `lake new`.
name = "math"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Math"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.24.0"

[[lean_lib]]
name = "Math"
