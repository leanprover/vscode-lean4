# A Reservoir dependency, a path dependency and a Git dependency in one file.
name = "foo"

[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "main"

[[require]]
name = "local"
path = "../local"

[[require]]
name = "dependency"
git = "https://github.com/User/package"
rev = "main"
subDir = "subdirectory"
