# A package with many of the package options.
name = "foo"
version = "1.2.3"
description = "A package"
keywords = ["math", "devtool"]
homepage = "https://example.com"
license = "Apache-2.0"
licenseFiles = ["LICENSE", "NOTICE"]
readmeFile = "README.md"
reservoir = false
buildType = "debug"
backend = "c"
precompileModules = true
preferReleaseBuild = true
platformIndependent = true
moreLeanArgs = ["-DmaxErrors=10"]
weakLeanArgs = ["-DmaxErrors=1"]
moreGlobalServerArgs = ["-DmaxHeartbeats=0"]
srcDir = "src"
buildDir = ".lake/build"
packagesDir = ".lake/packages"
testDriver = "FooTest"
testDriverArgs = ["--verbose"]
lintDriver = "lint"
enableArtifactCache = true
releaseRepo = "https://github.com/User/foo"
buildArchive = "foo.tar.gz"
