# `[[input_file]]` and `[[input_dir]]` targets, with a nested pattern table and `"*"` as `filter`.
name = "foo"

[[input_file]]
name = "config"
path = "config.json"
text = true

[[input_dir]]
name = "data"
path = "data"
text = true
filter = { any = [{ extension = ["json", "txt"] }, { fileName = { startsWith = "data_" } }] }

[[input_dir]]
name = "assets"
filter = "*"
